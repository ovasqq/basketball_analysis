[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-yandex"
version = "0.1.0"
description = "Калибровка баскетбольного корта и вид сверху"
requires-python = ">=3.10"
# Точные версии для воспроизводимости -- в requirements.txt.
dependencies = ["numpy", "opencv-python"]

[project.optional-dependencies]
# Автокалибровка нейросетью (basketball/kalicalib.py, main.py --auto).
nn = ["torch"]

[tool.setuptools]
packages = ["basketball"]
